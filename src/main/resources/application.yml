spring:

  application:
    name: heartbeat-monitor

  datasource:
    url: jdbc:postgresql://localhost:5432/heartbeat1
    username: heartbeat1
    password: heartbeat1
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

  flyway:
    enabled: true


server:
  port: 8080


monitoring:

  sweeper-delay-ms: 10000
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}


management:

  endpoints:
    web:
      exposure:
        include: health,info